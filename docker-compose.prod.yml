# docker-compose.prod.yml
# Production-grade orchestration for Webhook Relay Dashboard
# Complies with integration_skills.md §3 (Zero-Downtime & Resilience) 
# and backend_skills.md §1 (Advanced Resiliency & Fault Tolerance)

services:
  # ---------------------------------------------------------
  # DATABASE: PostgreSQL
  # ---------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: webhook-db
    environment:
      POSTGRES_USER: elite_relay
      POSTGRES_PASSWORD: Enuguonu20
      POSTGRES_DB: webhook_relay
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - webhook-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elite_relay -d webhook_relay"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ---------------------------------------------------------
  # CACHE & QUEUE: Redis
  # ---------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: webhook-redis
    # Enforce password and enable Append Only File (AOF) for persistence
    command: redis-server --requirepass secure_redis_pass --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - webhook-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "secure_redis_pass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ---------------------------------------------------------
  # BACKEND: Go API + Background Worker
  # ---------------------------------------------------------
  backend:
    build:
      context: ./webhook-relay
      dockerfile: Dockerfile
    container_name: webhook-backend
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://elite_relay:Enuguonu20@postgres:5433/webhook_relay?sslmode=disable
      - REDIS_URL=redis://:secure_redis_pass@redis:6379/0
      - WEBHOOK_SIGNING_SECRET=UX2mIQWtej46BIE4EYv/Z2ymoQbcO9hCu85sBh8/y7Y=
      - API_AUTH_TOKEN=dev-e2e-test-token-123
      - GIN_MODE=release
    ports:
      - "3000:3000"
    networks:
      - webhook-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ✅ RECTIFIED HEALTHCHECK: Forces IPv4 (127.0.0.1) to prevent Alpine wget IPv6 resolution failures
    healthcheck:
    # ✅ CORRECT: Uses curl with -f flag to fail on non-200 status codes
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ---------------------------------------------------------
  # FRONTEND: React/Vite + Nginx
  # ---------------------------------------------------------
  frontend:
    build:
      context: ./webhook-relay-dashboard
      dockerfile: Dockerfile
    container_name: webhook-frontend
    ports:
      - "80:80"
    networks:
      - webhook-net
    depends_on:
      - backend
    # ✅ RECTIFIED HEALTHCHECK: Forces IPv4 (127.0.0.1) for consistency
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

# ---------------------------------------------------------
# NETWORKS & VOLUMES
# ---------------------------------------------------------
networks:
  webhook-net:
    driver: bridge
    name: webhook-net

volumes:
  postgres_data:
    name: webhook_postgres_data
  redis_data:
    name: webhook_redis_data