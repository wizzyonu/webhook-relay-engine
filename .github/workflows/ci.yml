# .github/workflows/ci.yml
name: Webhook Relay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------
  # JOB 1: Frontend Quality Gates (Lint, Typecheck, Test)
  # ---------------------------------------------------------
  frontend-ci:
    name: Frontend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./webhook-relay-dashboard

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './webhook-relay-dashboard/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (Strict)
        run: npm run typecheck # Ensure you have "typecheck": "tsc --noEmit" in package.json

      - name: Lint
        run: npm run lint

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npx playwright test
        env:
          # Provide a dummy secret for CI. The skipped tests won't fail the build.
          TEST_WEBHOOK_SECRET: 'ci-dummy-secret'
          BACKEND_URL: 'http://localhost:3000'

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: webhook-relay-dashboard/playwright-report/
          retention-days: 30

  # ---------------------------------------------------------
  # JOB 2: Backend Quality Gates (Build, Test, Vet)
  # ---------------------------------------------------------
  backend-ci:
    name: Backend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./webhook-relay

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: './webhook-relay/go.sum'

      - name: Download Dependencies
        run: go mod download

      - name: Vet Code (Static Analysis)
        run: go vet ./...

      - name: Build Binary
        run: go build -v ./cmd/api

      - name: Run Unit Tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: webhook-relay/coverage.out